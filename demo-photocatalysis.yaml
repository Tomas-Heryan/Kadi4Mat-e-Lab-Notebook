# Worked example project spanning all four CEET areas:
#   TiO2 photocatalyst (areas 3 + 4) -> characterisation (XRD, SEM, BET)
#   -> photocatalytic removal of pharmaceuticals from WWTP effluent (area 2)
#   -> LC-MS/MS quantification (area 2) -> energy monitoring of the UV reactor (area 1)
#
# Every record is created from a template of the structure model: the `values` are
# checked offline against the template fields (types, units, options, required flags)
# exactly as the Kadi4Mat server would check them. Links use the PROV-O vocabulary.
# All data files are SYNTHETIC (data/demo/make_demo_data.py).
#
# PLACEHOLDERS: "PROJECT" stands for the project acronym and must be replaced before a real
# deployment. Kadi identifiers may only contain a-z 0-9 - _, so the same placeholder appears
# in lower case in identifiers ("proj-project"); replace it there as well.
# "SCIENTIST_NAME" stands for the person responsible / performing / evaluating.
schema_version: 1

collections:
  - identifier: proj-project
    title: PROJECT
    description: Project collection of PROJECT; the cover record `proj-project` carries the project metadata. Replace PROJECT (and the identifier proj-project) with the project acronym.
    parent: projects
    record_template: tmpl-experiment
    tags: [project, photocatalysis, pharmaceuticals]

records:

  # ============================================================ project cover record
  - identifier: proj-project
    template: tmpl-project
    title: "PROJECT – project cover record (photocatalytic removal of pharmaceuticals from WWTP effluent)"
    description: |
      Demonstration project of the CEET laboratory model. Sol-gel TiO2 photocatalysts are synthesised and
      characterised, tested for the degradation of pharmaceuticals in real WWTP effluent and evaluated for
      energy demand. **All data in this demo are synthetic.**
    collections: [proj-project]
    values:
      acronym: PROJECT
      funding:
        funder: TA CR
        programme: SIGMA
        grant_number: PROJECT grant number (demo)
        start_date: 2026-01-01
        end_date: 2028-12-31
      people:
        principal_investigator: SCIENTIST_NAME
        data_steward: Tomas Heryan
        contact_email: tomas.heryan@vsb.cz
      scientific_areas:
        - 3 Environmental Nanotechnology
        - 2 Applied Chemistry – Waste, Water, Air
        - 4 New Functional Materials
        - 1 Environmental Electricity & Engineering
      data_management:
        dmp_reference: https://example.org/dmp/PROJECT (demo)
        repository: Zenodo
        default_license: CC-BY-4.0
        confidentiality: internal
      zenodo_community: ceet-vsb-tuo
      keywords: [photocatalysis, TiO2, pharmaceuticals, wastewater, LC-MS/MS, energy efficiency]

