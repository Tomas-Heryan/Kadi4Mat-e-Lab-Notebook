# Controlled vocabulary shared by every model file.
#
# * record_types : the Kadi "type" of a record and the identifier prefix it must use
# * link_types   : the names used for record links, their ontology IRI (Kadi "term")
#                  and which record types may stand on each side
# * units        : spelling aliases -> canonical unit string (Kadi stores units as text,
#                  and its metadata search matches units exactly, so one spelling only)
# * unit_terms   : canonical unit -> QUDT IRI (documentation / RO-Crate enrichment)
schema_version: 1

vocab:
  record_types:
    project:            {prefix: proj-,  description: Project cover record (funding, people, areas); collections cannot carry metadata, this record can.}
    instrument:         {prefix: inst-,  description: Measuring device that produces data (XRD, SEM, LC-MS/MS, power analyser, ...).}
    equipment:          {prefix: eqp-,   description: Auxiliary laboratory equipment used in preparations and experiments (furnace, mill, reactor, SPE manifold, balance).}
    material:           {prefix: mat-,   description: Chemical, reagent, precursor, reference material or consumable batch used as an input.}
    sample:             {prefix: smpl-,  description: Physical sample or specimen, including derived samples (aliquots, calcined powders, extracts).}
    sample-preparation: {prefix: prep-,  description: Activity that transforms samples or materials into prepared samples (extraction, calcination, milling, ...).}
    experiment:         {prefix: exp-,   description: Measurement, test, characterisation or monitoring activity performed on an instrument.}
    method:             {prefix: meth-,  description: Versioned protocol, SOP, analytical method or test procedure (a PROV plan).}
    raw-data:           {prefix: raw-,   description: Primary data set produced by an experiment, with file-level integrity information.}
    result:             {prefix: res-,   description: Evaluated / processed result derived from raw data.}

  link_types:
    # --- PROV-O core ------------------------------------------------------------------
    used:
      term: http://www.w3.org/ns/prov#used
      description: An activity (experiment, preparation) used an entity (sample, material, equipment, instrument, method, data).
      sources: [experiment, sample-preparation]
      targets: [sample, material, equipment, instrument, method, raw-data, result]
    was_generated_by:
      term: http://www.w3.org/ns/prov#wasGeneratedBy
      description: An entity (sample, data, result, material batch) was produced by an activity.
      sources: [sample, raw-data, result, material]
      targets: [experiment, sample-preparation]
    was_derived_from:
      term: http://www.w3.org/ns/prov#wasDerivedFrom
      description: An entity was derived from another entity (aliquot from sample, result from raw data).
      sources: [sample, raw-data, result, material]
      targets: [sample, raw-data, result, material]
    was_informed_by:
      term: http://www.w3.org/ns/prov#wasInformedBy
      description: An activity depended on an earlier activity (an experiment that followed a preparation).
      sources: [experiment, sample-preparation]
      targets: [experiment, sample-preparation]
    follows_plan:
      term: http://www.w3.org/ns/prov#hadPlan
      description: An activity followed a method / protocol (PROV plan).
      sources: [experiment, sample-preparation]
      targets: [method]
    measured_on:
      term: https://schema.org/instrument
      description: An experiment was carried out on an instrument (device).
      sources: [experiment]
      targets: [instrument]
    # --- organisation -----------------------------------------------------------------
    part_of_project:
      term: https://schema.org/isPartOf
      description: Any record belongs to a project (points to the project cover record).
      sources: ["*"]
      targets: [project]
    supersedes:
      term: http://purl.org/dc/terms/replaces
      description: A newer method version replaces an older one.
      sources: [method]
      targets: [method]
    calibrated_with:
      term: http://www.w3.org/ns/prov#used
      description: An instrument calibration experiment used a reference material.
      sources: [experiment]
      targets: [material]
    documented_in:
      term: https://schema.org/subjectOf
      description: Device or equipment is documented in a method / manual record.
      sources: [instrument, equipment]
      targets: [method]

